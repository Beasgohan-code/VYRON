    <style>
      /* First paint — pure CSS, before React exists. Same visual language as
         the React boot screen so the hand-off is invisible. */
      html { background: #05070a; }
      body { margin: 0; background: #05070a; }

      .boot {
        position: fixed; inset: 0; z-index: 90;
        display: grid; grid-template-rows: 1fr auto 1fr;
        justify-items: center; align-items: center;
        overflow: hidden;
        background: #05070a;
        color: #eaf6f4;
        font-family: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .boot::before {
        content: ""; position: absolute; inset: -10%;
        background: url("/app/static/brand/boot.jpg") center / cover no-repeat;
        opacity: 0.55; transform: scale(1.04);
        animation: boot-drift 9s ease-in-out infinite alternate;
      }
      .boot::after {
        content: ""; position: absolute; inset: 0;
        background:
          radial-gradient(60% 45% at 50% 42%, rgba(45, 232, 200, 0.18), transparent 70%),
          linear-gradient(180deg, rgba(5, 7, 10, 0.75), rgba(5, 7, 10, 0.2) 35%, rgba(5, 7, 10, 0.92));
      }
      .boot-inner {
        position: relative; z-index: 2;
        grid-row: 2;
        display: grid; justify-items: center; gap: 18px;
        padding: 0 32px;
        text-align: center;
      }
      .boot-mark {
        display: grid; place-items: center;
        width: 76px; height: 76px; border-radius: 24px;
        background: radial-gradient(120% 120% at 30% 20%, #0d2422, #06100f);
        border: 1px solid rgba(45, 232, 200, 0.35);
        box-shadow: 0 26px 70px -30px rgba(45, 232, 200, 0.75), inset 0 0 30px rgba(45, 232, 200, 0.12);
        overflow: hidden;
      }
      .boot-mark img { width: 100%; height: 100%; object-fit: cover; }
      .boot-word {
        font-family: "Bricolage Grotesque", "Inter Tight", system-ui, sans-serif;
        font-size: 26px; font-weight: 800; letter-spacing: 0.26em; text-indent: 0.26em;
      }
      .boot-tag {
        font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
        color: rgba(234, 246, 244, 0.5);
      }
      .boot-bar {
        position: relative; width: min(220px, 60vw); height: 2px; border-radius: 2px;
        background: rgba(255, 255, 255, 0.1); overflow: hidden;
      }
      .boot-bar span {
        position: absolute; inset: 0 auto 0 0; width: 40%;
        background: linear-gradient(90deg, transparent, #2de8c8, #8b5cf6, transparent);
        animation: boot-sweep 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes boot-sweep { from { transform: translateX(-110%); } to { transform: translateX(300%); } }
      @keyframes boot-drift { from { transform: scale(1.04) translateY(-6px); } to { transform: scale(1.09) translateY(6px); } }
      @media (prefers-reduced-motion: reduce) {
        .boot::before, .boot-bar span { animation: none; }
      }
    </style>
