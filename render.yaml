# ─────────────────────────────────────────────────────────────────────────────
#  VYRON — Render blueprint
#  New + Blueprint → point at this repo → fill the secrets → deploy.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: vyron
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      # required: the assistant account that streams into voice chats
      - key: STRING_SESSION
        sync: false
      - key: OWNER_ID
        sync: false
      - key: BOT_USERNAME
        value: VyronMusicBot
      - key: MONGO_URL
        sync: false
      - key: AUDIO_QUALITY
        value: high
      - key: VIDEO_QUALITY
        value: 720p
      - key: DEFAULT_VOLUME
        value: "100"
      - key: IDLE_LEAVE_SECONDS
        value: "300"
      - key: PREMIUM_EMOJI
        value: "true"
      - key: RICH_MESSAGES
        value: "true"
      - key: MUSIC_API
        value: "true"
      - key: MUSIC_API_RATE
        value: "30"
      - key: LOG_LEVEL
        value: INFO
      - key: KEEPALIVE_MINUTES
        value: "10"
      - key: WATCHDOG_SECONDS
        value: "60"
      # PORT is injected by Render — do not pin it here, or the app binds a
      # port the router never talks to and the health check fails.
      - key: DATA_DIR
        value: /app/data
      - key: DOWNLOADS_DIR
        value: /app/data/downloads
    disk:
      name: vyron-data
      mountPath: /app/data
      sizeGB: 1
