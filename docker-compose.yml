services:
  vyron:
    build: .
    image: vyron:latest
    container_name: vyron
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8080
      DATA_DIR: /app/data
      DOWNLOADS_DIR: /app/downloads
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
      # mount a cookies.txt here if YouTube asks for verification
      # - ./cookies.txt:/app/cookies.txt:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
